<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>Pac-Man-Like</title>
<style>
:root { color-scheme: dark }
* { margin: 0; padding: 0; box-sizing: border-box }
html, body { height: 100% }
body {
  background: #000;
  color: #eee;
  font-family: ui-monospace, Menlo, Consolas, monospace;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  user-select: none;
  -webkit-user-select: none;
  touch-action: none;
}
#wrap { display: flex; flex-direction: column; gap: 10px; padding: 12px; width: 100%; align-items: center }
#hud { display: flex; justify-content: space-between; width: 100%; max-width: 480px }
.lab { font-size: 11px; letter-spacing: 2px; color: #8f8fff; margin-bottom: 4px }
.val { font-size: 22px; font-weight: 700; color: #ffe600; text-shadow: 0 0 8px rgba(255,230,0,.45) }
#mid .val { color: #fff; text-shadow: none }
#right { text-align: right }
#stage { position: relative; width: 100%; max-width: 480px }
#c {
  width: 100%; height: auto; display: block;
  image-rendering: pixelated;
  border: 2px solid #191970;
  box-shadow: 0 0 24px rgba(40,40,255,.25);
}
#overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(0,0,10,.72);
  gap: 10px; text-align: center; padding: 16px;
}
#otitle { font-size: 26px; font-weight: 800; letter-spacing: 6px; color: #ffe600; text-shadow: 0 0 14px rgba(255,230,0,.6) }
#osub { font-size: 12px; letter-spacing: 2px; line-height: 1.9; color: #cfd2ff }
#foot { display: flex; align-items: center; justify-content: space-between; width: 100%; max-width: 480px }
#lives { display: flex; gap: 6px; align-items: center; min-height: 20px }
#hint { font-size: 10px; letter-spacing: 1px; color: #666aa8; text-align: right }
@media (max-width: 420px) { .val { font-size: 18px } #otitle { font-size: 20px } #hint { display: none } }
</style>
</head>
<body>
<div id="wrap">
  <div id="hud">
    <div><div class="lab">SCORE</div><div class="val" id="score">0</div></div>
    <div id="mid"><div class="lab">LEVEL</div><div class="val" id="level">1</div></div>
    <div id="right"><div class="lab">HIGH</div><div class="val" id="high">0</div></div>
  </div>
  <div id="stage">
    <canvas id="c" width="336" height="336"></canvas>
    <div id="overlay">
      <div id="otitle"></div>
      <div id="osub"></div>
    </div>
  </div>
  <div id="foot">
    <div id="lives"></div>
    <div id="hint">ARROWS / WASD MOVE &middot; P PAUSE &middot; ENTER START</div>
  </div>
</div>
<script>
'use strict';
const T = 16, COLS = 21, ROWS = 21;
const MAZE = [
  "#####################",
  "#.........#.........#",
  "#o##.####...####.##o#",
  "#...................#",
  "#.##.#....#....#.##.#",
  "#....#...#.#...#....#",
  "####.####...####.####",
  "####.#.....#...#.####",
  "#.......## ##.......#",
  "#.......#ggg#.......#",
  "#.......#####.......#",
  "#.........#.........#",
  "#o##.####...####.##o#",
  "#.##.#.........#.##.#",
  "####.#####.#####.####",
  "##...####...####...##",
  "#....#.........#.#..#",
  "#.##.#...#.#####.##.#",
  "#.#.######.########.#",
  "#....##.......##....#",
  "#####################"
];
const DOOR = { c: 10, r: 8 };
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const elScore = document.getElementById('score');
const elHigh = document.getElementById('high');
const elLevel = document.getElementById('level');
const elLives = document.getElementById('lives');
const elOv = document.getElementById('overlay');
const elOvT = document.getElementById('otitle');
const elOvS = document.getElementById('osub');

let dots, dotCount, score, hiscore, lives, level, t, waka = 0;
let frightT = 0, combo = 0;
let modeIdx = 0, modeT = 4;
const PHASES = [[0, 4], [1, 12], [0, 4], [1, 15], [0, 4], [1, 15], [0, 4], [1, 999999]];
let state = 0, readyT = 0, dieT = 0, lvT = 0;
const ST = { READY: 0, PLAY: 1, DIE: 2, OVER: 3, LEVELUP: 4, PAUSE: 5 };
const UP = { x: 0, y: -1 }, DOWN = { x: 0, y: 1 }, LEFT = { x: -1, y: 0 }, RIGHT = { x: 1, y: 0 };
const DIRS = [UP, LEFT, DOWN, RIGHT];
const PSTART = { c: 10, r: 17 };
let extraGiven = false;
const floats = [];

function wallAtPac(c, r) {
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return true;
  const ch = MAZE[r][c];
  if (ch === '#' || ch === 'g') return true;
  if (c === DOOR.c && r === DOOR.r) return true;
  return false;
}
function wallAtGhost(c, r) {
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return true;
  const ch = MAZE[r][c];
  return ch === '#' || ch === 'g';
}
const ccx = c => (c + 0.5) * T;
const atCenter = e => Math.abs(e.x % T - T / 2) < 1e-6 && Math.abs(e.y % T - T / 2) < 1e-6;
const tileOf = e => ({ c: Math.floor(e.x / T), r: Math.floor(e.y / T) });

const pac = { x: ccx(PSTART.c), y: ccx(PSTART.r), dir: { x: 0, y: 0 }, want: { x: 0, y: 0 }, speed: 72, mouth: 0, moving: false };

const GHOST_DEFS = [
  { name: 'blinky', color: '#ff0000', scatter: { c: 19, r: 1 }, start: { c: 10, r: 7 }, houseT: -1 },
  { name: 'pinky', color: '#ffb8ff', scatter: { c: 1, r: 1 }, start: { c: 10, r: 9 }, houseT: 1 },
  { name: 'inky', color: '#00ffff', scatter: { c: 19, r: 19 }, start: { c: 9, r: 9 }, houseT: 3 },
  { name: 'clyde', color: '#ffb852', scatter: { c: 1, r: 19 }, start: { c: 11, r: 9 }, houseT: 5 }
];
let ghosts = [];

function makeGhosts() {
  ghosts = GHOST_DEFS.map(d => ({
    name: d.name, color: d.color, scatter: d.scatter,
    x: ccx(d.start.c), y: ccx(d.start.r),
    dir: { x: 0, y: 0 }, state: d.houseT < 0 ? 'out' : 'house',
    houseT: d.houseT < 0 ? 0 : d.houseT, frightened: false, ph: Math.random() * 6
  }));
}
function resetPositions() {
  pac.x = ccx(PSTART.c); pac.y = ccx(PSTART.r);
  pac.dir = { x: 0, y: 0 }; pac.want = { x: 0, y: 0 }; pac.mouth = 0; pac.moving = false;
  frightT = 0; combo = 0; modeIdx = 0; modeT = 4;
  makeGhosts();
}
function initDots() {
  dots = MAZE.map(row => row.split(''));
  dotCount = 0;
  for (const row of dots) for (const ch of row) if (ch === '.' || ch === 'o') dotCount++;
}

let actx = null, muted = false;
function ac() {
  if (!actx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    actx = new AC();
  }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(f0, f1, dur, type = 'square', vol = 0.05, delay = 0) {
  if (muted) return;
  const a = ac();
  if (!a) return;
  const t0 = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f0, t0);
  o.frequency.exponentialRampToValueAtTime(Math.max(1, f1), t0 + dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g).connect(a.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
const sfxWaka = () => { waka ^= 1; tone(waka ? 520 : 390, waka ? 390 : 520, 0.07, 'triangle', 0.06); };
const sfxPellet = () => tone(220, 640, 0.18, 'sine', 0.06);
const sfxGhost = () => { tone(340, 1080, 0.28, 'sawtooth', 0.05); tone(170, 540, 0.28, 'square', 0.03); };
const sfxDie = () => tone(620, 70, 0.9, 'sawtooth', 0.06);
const sfxLevel = () => { [440, 554, 659, 880].forEach((f, i) => tone(f, f, 0.09, 'square', 0.05, i * 0.09)); };
const sfxLife = () => { [660, 880, 990, 1320].forEach((f, i) => tone(f, f, 0.08, 'square', 0.05, i * 0.07)); };

function showOverlay(title, lines) {
  elOv.style.display = 'flex';
  elOvT.textContent = title;
  elOvS.innerHTML = lines.join('<br>');
}
function hideOverlay() { elOv.style.display = 'none'; }

function updateHud() {
  elScore.textContent = score;
  elHigh.textContent = Math.max(hiscore, score);
  elLevel.textContent = level;
}
function drawLifeIcon() {
  const c = document.createElement('canvas');
  c.width = 18; c.height = 18;
  const x = c.getContext('2d');
  x.fillStyle = '#ffe600';
  x.beginPath();
  x.moveTo(9, 9);
  x.arc(9, 9, 7.5, Math.PI * 1.2, Math.PI * 2.8);
  x.fill();
  return c;
}
function updateLives() {
  elLives.innerHTML = '';
  for (let i = 0; i < lives - 1; i++) elLives.appendChild(drawLifeIcon());
}
function setWant(d) {
  pac.want = d;
  if ((d.x === -pac.dir.x && d.y === -pac.dir.y) && (pac.dir.x || pac.dir.y)) pac.dir = d;
}
function addScore(n) {
  score += n;
  if (!extraGiven && score >= 10000) { extraGiven = true; lives++; sfxLife(); updateLives(); }
  if (score > hiscore) {
    hiscore = score;
    try { localStorage.setItem('pacLikeHiscore', String(hiscore)); } catch (e) {}
  }
  updateHud();
}

let wallCv, flashCv;
function buildWalls(color, glow) {
  const c = document.createElement('canvas');
  c.width = cv.width; c.height = cv.height;
  const x = c.getContext('2d');
  x.strokeStyle = color;
  x.lineWidth = 2;
  x.lineCap = 'round';
  x.shadowColor = glow;
  x.shadowBlur = 6;
  const open = (c2, r2) => (c2 < 0 || r2 < 0 || c2 >= COLS || r2 >= ROWS) ? false : MAZE[r2][c2] !== '#';
  for (let r = 0; r < ROWS; r++) for (let c2 = 0; c2 < COLS; c2++) {
    if (MAZE[r][c2] !== '#') continue;
    const px = c2 * T, py = r * T;
    if (open(c2, r - 1)) { x.beginPath(); x.moveTo(px + 2, py + 2); x.lineTo(px + T - 2, py + 2); x.stroke(); }
    if (open(c2, r + 1)) { x.beginPath(); x.moveTo(px + 2, py + T - 2); x.lineTo(px + T - 2, py + T - 2); x.stroke(); }
    if (open(c2 - 1, r)) { x.beginPath(); x.moveTo(px + 2, py + 2); x.lineTo(px + 2, py + T - 2); x.stroke(); }
    if (open(c2 + 1, r)) { x.beginPath(); x.moveTo(px + T - 2, py + 2); x.lineTo(px + T - 2, py + T - 2); x.stroke(); }
  }
  return c;
}

function snapCenter(e) {
  e.x = Math.round(e.x / T - 0.5) * T + T / 2;
  e.y = Math.round(e.y / T - 0.5) * T + T / 2;
}
function stepEdge(e, dist) {
  let rem = dist;
  while (rem > 1e-9) {
    if (atCenter(e)) {
      if (!e.dir || (e.dir.x === 0 && e.dir.y === 0)) { snapCenter(e); return; }
      const d = Math.min(rem, T);
      e.x += e.dir.x * d;
      e.y += e.dir.y * d;
      rem -= d;
    } else {
      const v = e.dir.x ? e.x : e.y;
      const s = e.dir.x || e.dir.y;
      let n = (Math.floor(v / T) + 0.5) * T;
      if (s === 1 && n - v < 1e-9) n += T;
      if (s === -1 && v - n < 1e-9) n -= T;
      const edge = Math.abs(n - v);
      const d = Math.min(rem, edge);
      if (e.dir.x) e.x += e.dir.x * d;
      else e.y += e.dir.y * d;
      rem -= d;
      if (rem > 1e-9) return;
    }
  }
}

function pacDecide() {
  const { c, r } = tileOf(pac);
  const w = pac.want;
  if ((w.x || w.y) && !wallAtPac(c + w.x, r + w.y)) pac.dir = { x: w.x, y: w.y };
  if ((pac.dir.x || pac.dir.y) && wallAtPac(c + pac.dir.x, r + pac.dir.y)) pac.dir = { x: 0, y: 0 };
}

function targetFor(g) {
  const pc = tileOf(pac);
  if (g.name === 'blinky') return pc;
  if (g.name === 'pinky') return { c: pc.c + pac.dir.x * 4, r: pc.r + pac.dir.y * 4 };
  if (g.name === 'inky') {
    const b = tileOf(ghosts[0]);
    const ax = pc.c + pac.dir.x * 2, ay = pc.r + pac.dir.y * 2;
    return { c: 2 * ax - b.c, r: 2 * ay - b.r };
  }
  const dt = (g.x - pac.x) * (g.x - pac.x) + (g.y - pac.y) * (g.y - pac.y);
  return dt > 64 * T * T ? pc : g.scatter;
}
function aiPick(g, wallFn) {
  const { c, r } = tileOf(g);
  const opts = [];
  for (const d of DIRS) {
    const nc = c + d.x, nr = r + d.y;
    if (wallFn(nc, nr)) continue;
    if (d.x === -g.dir.x && d.y === -g.dir.y) continue;
    if (g.state === 'out' && nc === DOOR.c && nr === DOOR.r) continue;
    opts.push(d);
  }
  if (!opts.length) { g.dir = { x: -g.dir.x, y: -g.dir.y }; return; }
  if (g.state === 'out' && g.frightened) {
    g.dir = opts[(Math.random() * opts.length) | 0];
    return;
  }
  const target = g.state === 'eyes' ? DOOR : (PHASES[modeIdx][0] === 0 && g.state !== 'eyes' ? g.scatter : targetFor(g));
  let best = opts[0], bd = Infinity;
  for (const d of opts) {
    const dc = (c + d.x - target.c) * (c + d.x - target.c) + (r + d.y - target.r) * (r + d.y - target.r);
    if (dc < bd) { bd = dc; best = d; }
  }
  g.dir = best;
}
function outDecide(g) { aiPick(g, wallAtGhost); }
function leaveDecide(g) {
  const cx = ccx(DOOR.c), dy = ccx(DOOR.r);
  if (Math.abs(g.x - cx) > 0.5) g.dir = { x: Math.sign(cx - g.x), y: 0 };
  else if (g.y > dy + 0.5) g.dir = { x: 0, y: -1 };
  else if (atCenter(g) && g.y <= dy + 0.5) {
    g.state = 'out';
    g.dir = Math.random() < 0.5 ? LEFT : RIGHT;
    g.frightened = frightT > 0;
  }
}
function enterDecide(g) {
  g.dir = { x: 0, y: 1 };
  if (atCenter(g) && Math.abs(g.y - ccx(9)) < 0.6) {
    g.state = 'house';
    g.houseT = 0.6;
    g.x = ccx(DOOR.c);
    g.y = ccx(9);
  }
}

function eatDot() {
  const { c, r } = tileOf(pac);
  if (c < 0 || r < 0 || c >= COLS || r >= ROWS) return;
  const ch = dots[r][c];
  if (ch === '.') {
    dots[r][c] = ' ';
    dotCount--;
    addScore(10);
    sfxWaka();
  } else if (ch === 'o') {
    dots[r][c] = ' ';
    dotCount--;
    addScore(50);
    sfxPellet();
    combo = 0;
    frightT = Math.max(2.5, 6 - (level - 1) * 0.5);
    for (const g of ghosts) if (g.state === 'out') g.frightened = true;
  }
}

function updatePac(dt) {
  if (atCenter(pac)) pacDecide();
  pac.moving = !!(pac.dir.x || pac.dir.y);
  if (pac.moving) {
    stepEdge(pac, pac.speed * dt);
    pac.mouth += dt * 9;
  }
}

function ghostSpeed(g) {
  const lv = Math.min(level - 1, 6) * 3;
  if (g.state === 'leaving') return 55;
  if (g.state === 'entering') return 60;
  if (g.state === 'eyes') return 175 + lv;
  if (g.frightened) return 45;
  return 62 + lv;
}
function updateGhost(g, dt) {
  if (g.state === 'house') {
    g.houseT -= dt;
    if (g.houseT <= 0) { g.state = 'leaving'; g.dir = { x: 0, y: 0 }; }
    return;
  }
  if (g.state === 'eyes' && atCenter(g)) {
    const { c, r } = tileOf(g);
    if (c === DOOR.c && r === DOOR.r) g.state = 'entering';
  }
  if (atCenter(g)) {
    if (g.state === 'leaving') leaveDecide(g);
    else if (g.state === 'entering') enterDecide(g);
    else outDecide(g);
  }
  stepEdge(g, ghostSpeed(g) * dt);
}

function checkCollisions() {
  for (const g of ghosts) {
    if (g.state !== 'out') continue;
    const dx = g.x - pac.x, dy = g.y - pac.y;
    if (dx * dx + dy * dy > 81) continue;
    if (g.frightened) {
      const pts = 200 * Math.pow(2, Math.min(combo, 3));
      combo++;
      addScore(pts);
      sfxGhost();
      floats.push({ x: g.x, y: g.y, txt: String(pts), life: 1 });
      g.frightened = false;
      g.state = 'eyes';
    } else {
      state = ST.DIE;
      dieT = 1.6;
      sfxDie();
      return;
    }
  }
}

function updatePlay(dt) {
  if (frightT > 0) {
    frightT -= dt;
    if (frightT <= 0) {
      frightT = 0;
      for (const g of ghosts) if (g.state === 'out') g.frightened = false;
    }
  } else {
    modeT -= dt;
    if (modeT <= 0) {
      modeIdx = Math.min(modeIdx + 1, PHASES.length - 1);
      modeT = PHASES[modeIdx][1];
    }
  }
  updatePac(dt);
  eatDot();
  for (const g of ghosts) updateGhost(g, dt);
  checkCollisions();
  if (state !== ST.PLAY) return;
  for (let i = floats.length - 1; i >= 0; i--) {
    floats[i].life -= dt;
    floats[i].y -= dt * 12;
    if (floats[i].life <= 0) floats.splice(i, 1);
  }
  if (dotCount === 0) {
    state = ST.LEVELUP;
    lvT = 2;
    sfxLevel();
  }
}
function finishDeath() {
  lives--;
  updateLives();
  if (lives <= 0) {
    state = ST.OVER;
    try { localStorage.setItem('pacLikeHiscore', String(hiscore)); } catch (e) {}
    showOverlay('GAME OVER', ['SCORE ' + score, 'HIGH ' + Math.max(hiscore, score), '', 'PRESS ENTER TO RESTART']);
  } else {
    resetPositions();
    state = ST.READY;
    readyT = 1;
    updateLives();
    showOverlay('READY', ['PREPARE TO EAT', '', 'ARROWS / WASD TO MOVE']);
  }
}
function update(dt) {
  const S = 1000 / 60;
  let n = Math.max(1, Math.round(dt * 60));
  while (n-- > 0 && state !== ST.PAUSE) tick(S / 1000);
  render();
}
function tick(sdt) {
  t += sdt;
  if (state === ST.READY) {
    readyT -= sdt;
    if (readyT <= 0) { state = ST.PLAY; hideOverlay(); }
  } else if (state === ST.DIE) {
    dieT -= sdt;
    if (dieT <= 0) finishDeath();
  } else if (state === ST.LEVELUP) {
    lvT -= sdt;
    if (lvT <= 0) {
      level++;
      initDots();
      resetPositions();
      updateHud();
      state = ST.READY;
      readyT = 0.8;
      showOverlay('LEVEL ' + level, ['GET READY', '', 'THE GHOSTS ARE FASTER NOW']);
    }
  } else if (state === ST.PLAY) {
    updatePlay(sdt);
  }
}

function render() {
  ctx.clearRect(0, 0, cv.width, cv.height);
  ctx.drawImage(state === ST.LEVELUP && ((t * 4) | 0) % 2 === 0 ? flashCv : wallCv, 0, 0);
  ctx.fillStyle = '#ffb8ff';
  ctx.fillRect(ccx(DOOR.c) - 5, ccx(DOOR.r) + T / 2 - 1.5, 10, 3);
  drawDots();
  for (const g of ghosts) drawGhost(g);
  drawPac();
  drawFloats();
}
function drawDots() {
  if (!dots) return;
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
    const ch = dots[r][c];
    if (ch === '.' || ch === 'o') {
      const x = ccx(c), y = ccx(r);
      if (ch === '.') {
        ctx.fillStyle = '#ffb894';
        ctx.beginPath();
        ctx.arc(x, y, 2.2, 0, Math.PI * 2);
        ctx.fill();
      } else {
        const rad = 4.5 + Math.sin(t * 7) * 1.3;
        ctx.fillStyle = '#ffd9c0';
        ctx.beginPath();
        ctx.arc(x, y, rad, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
}
function angOf(d) {
  if (d.x === 1) return 0;
  if (d.x === -1) return Math.PI;
  if (d.y === -1) return -Math.PI / 2;
  if (d.y === 1) return Math.PI / 2;
  return 0;
}
function drawPac() {
  const x = pac.x, y = pac.y;
  const R = T * 0.46;
  if (state === ST.DIE) {
    const p = 1 - Math.max(0, dieT) / 1.6;
    const open = Math.min(Math.PI, 0.2 + p * 2.6);
    ctx.save();
    ctx.globalAlpha = Math.max(0, 1 - Math.max(0, p - 0.6) / 0.4);
    ctx.translate(x, y);
    ctx.rotate(p * Math.PI * 2);
    ctx.fillStyle = '#ffe600';
    ctx.beginPath();
    ctx.moveTo(0, 0);
    ctx.arc(0, 0, R, open, Math.PI * 2 - open);
    ctx.fill();
    ctx.restore();
    return;
  }
  let open = 0.05 + 0.3 * (0.5 + 0.5 * Math.sin(pac.mouth * 2));
  if (!pac.moving) open = 0.25;
  const a = angOf(pac.dir);
  ctx.fillStyle = '#ffe600';
  ctx.beginPath();
  ctx.moveTo(x, y);
  ctx.arc(x, y, R, a + open, a + Math.PI * 2 - open);
  ctx.fill();
}
function drawGhost(g) {
  const x = g.x;
  let y = g.y;
  if (g.state === 'house') y += Math.sin(t * 5 + g.ph) * 2;
  const r = T * 0.44;
  const eyesOnly = g.state === 'eyes' || g.state === 'entering';
  if (!eyesOnly) {
    let body = g.color, face = null;
    if (g.frightened) {
      const blink = frightT < 2 && ((t * 8) | 0) % 2 === 0;
      body = blink ? '#f0f0f0' : '#2135c8';
      face = blink ? '#2135c8' : '#fff';
    }
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(x, y, r, Math.PI, Math.PI * 2);
    ctx.lineTo(x + r, y + r);
    ctx.lineTo(x + r * 2 / 3, y + r * 0.62);
    ctx.lineTo(x + r / 3, y + r);
    ctx.lineTo(x, y + r * 0.62);
    ctx.lineTo(x - r / 3, y + r);
    ctx.lineTo(x - r * 2 / 3, y + r * 0.62);
    ctx.lineTo(x - r, y + r);
    ctx.closePath();
    ctx.fill();
    if (face) {
      ctx.fillStyle = face;
      ctx.beginPath(); ctx.arc(x - r * 0.35, y - r * 0.1, r * 0.24, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + r * 0.35, y - r * 0.1, r * 0.24, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = face;
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(x - r * 0.6, y + r * 0.4);
      ctx.lineTo(x - r * 0.3, y + r * 0.2);
      ctx.lineTo(x, y + r * 0.4);
      ctx.lineTo(x + r * 0.3, y + r * 0.2);
      ctx.lineTo(x + r * 0.6, y + r * 0.4);
      ctx.stroke();
      return;
    }
    drawEyes(x, y, r, g.dir, 1);
  } else {
    drawEyes(x, y, r, g.dir, 1.25);
  }
}
function drawEyes(x, y, r, dir, scale) {
  const off = 0.35 * r * scale;
  for (const s of [-1, 1]) {
    const ex = x + s * r * 0.38, ey = y - r * 0.12;
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(ex, ey, r * 0.3 * scale, r * 0.38 * scale, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#1933c8';
    ctx.beginPath();
    ctx.arc(ex + dir.x * off * 0.6, ey + dir.y * off * 0.6, r * 0.16 * scale, 0, Math.PI * 2);
    ctx.fill();
  }
}
function drawFloats() {
  ctx.font = 'bold 10px monospace';
  ctx.textAlign = 'center';
  for (const f of floats) {
    ctx.globalAlpha = Math.max(0, Math.min(1, f.life));
    ctx.fillStyle = '#fff';
    ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

let lastTs = 0;
function frame(ts) {
  window.requestAnimationFrame(frame);
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (dt > 0.25) dt = 0.25;
  if (dt <= 0) return;
  update(dt);
}

function startGame() {
  score = 0;
  level = 1;
  lives = 3;
  extraGiven = false;
  initDots();
  resetPositions();
  updateHud();
  updateLives();
  t = 0;
  state = ST.READY;
  readyT = 1.2;
  showOverlay('PAC-LIKE', ['EAT EVERY DOT', 'AVOID THE GHOSTS', '', 'ARROWS / WASD TO MOVE', 'P TO PAUSE']);
}
function togglePause() {
  if (state === ST.PLAY) {
    state = ST.PAUSE;
    showOverlay('PAUSED', ['PRESS P TO RESUME']);
  } else if (state === ST.PAUSE) {
    state = ST.PLAY;
    hideOverlay();
  }
}
function ensureAudio() { ac(); }

window.addEventListener('keydown', e => {
  const k = e.key;
  let d = null;
  if (k === 'ArrowUp' || k === 'w' || k === 'W') d = UP;
  else if (k === 'ArrowDown' || k === 's' || k === 'S') d = DOWN;
  else if (k === 'ArrowLeft' || k === 'a' || k === 'A') d = LEFT;
  else if (k === 'ArrowRight' || k === 'd' || k === 'D') d = RIGHT;
  if (d) {
    e.preventDefault();
    if (state === ST.READY) { state = ST.PLAY; hideOverlay(); }
    setWant(d);
  } else if (k === 'p' || k === 'P' || k === 'Escape') {
    togglePause();
  } else if (k === 'm' || k === 'M') {
    muted = !muted;
  } else if (k === 'Enter' || k === ' ') {
    e.preventDefault();
    ensureAudio();
    if (state === ST.READY) { state = ST.PLAY; hideOverlay(); }
    else if (state === ST.OVER) startGame();
  }
  ensureAudio();
});

let tTouch = null;
const stage = document.getElementById('stage');
stage.addEventListener('touchstart', e => {
  ensureAudio();
  const t0 = e.changedTouches[0];
  tTouch = { x: t0.clientX, y: t0.clientY };
}, { passive: true });
stage.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
stage.addEventListener('touchend', e => {
  if (!tTouch) return;
  const t0 = e.changedTouches[0];
  const dx = t0.clientX - tTouch.x, dy = t0.clientY - tTouch.y;
  tTouch = null;
  if (state === ST.READY || state === ST.OVER) {
    if (state === ST.OVER) startGame();
    else { state = ST.PLAY; hideOverlay(); }
    return;
  }
  if (Math.hypot(dx, dy) < 20) return;
  setWant(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? RIGHT : LEFT) : (dy > 0 ? DOWN : UP));
  if (state === ST.READY) { state = ST.PLAY; hideOverlay(); }
});
stage.addEventListener('mousedown', e => {
  ensureAudio();
  e.preventDefault();
  if (state === ST.READY) { state = ST.PLAY; hideOverlay(); }
  else if (state === ST.OVER) startGame();
});

try { hiscore = parseInt(localStorage.getItem('pacLikeHiscore') || '0', 10) || 0; } catch (e) { hiscore = 0; }
wallCv = buildWalls('#2a2af0', '#4040ff');
flashCv = buildWalls('#ffffff', '#ffffff');
startGame();
window.requestAnimationFrame(frame);
</script>
